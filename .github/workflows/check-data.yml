# 資料檔自動檢查：data/*.json 有變動就跑（在 GitHub 網頁直接改也會觸發）
# 失敗時 commit 旁邊會出現紅色 ✗，GitHub 會寄 email 通知。
# 注意：這個檢查擋不住上線（GitHub Pages 照樣部署），只負責通知。
name: 資料檔檢查

on:
  push:
    paths:
      - 'data/**'
      - 'data-check.js'
      - 'tests/check_data.js'
      - 'tests/test_check_data.js'
      - '.github/workflows/check-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'data-check.js'
      - 'tests/check_data.js'
      - 'tests/test_check_data.js'
      - '.github/workflows/check-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查規則本身的測試
        run: node tests/test_check_data.js
      - name: 檢查 data/schedule.json 與 data/announcements.json
        run: node tests/check_data.js
