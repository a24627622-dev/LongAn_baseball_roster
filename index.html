<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍安棒球隊</title>
  <meta name="description" content="龍安棒球隊官方網站：本週活動、最新公告與賽事時程。">
  <link rel="icon" href="logo-192.png">
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="logo-192.png" alt="龍安棒球隊隊徽" onerror="this.style.display='none'">
        <span>龍安棒球隊</span>
      </a>
      <nav class="site-nav">
        <a href="index.html" class="active">首頁</a>
        <a href="news.html">公告</a>
        <a href="schedule.html">賽事時程</a>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <section id="hero" class="hero empty" aria-live="polite">載入中…</section>

    <div class="cols" id="cols">

      <div class="col-pin" id="game-pin"></div>

      <section class="col-news">
        <div class="section-head">
          <h2>最新公告</h2>
          <a class="more-link" href="news.html">全部公告 →</a>
        </div>
        <div id="news-list"><div class="empty-note">載入中…</div></div>
      </section>

      <section class="col-links">
        <div class="section-head">
          <h2>快速前往</h2>
        </div>
        <a class="entry" href="schedule.html">
          <strong>賽事時程 &amp; 練球</strong>
          <span>接下來的比賽與練球安排</span>
        </a>
        <a class="entry" href="news.html">
          <strong>公告</strong>
          <span>球隊最新公佈事項</span>
        </a>
      </section>

    </div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>龍安棒球隊</span>
      <a href="tools/">球隊管理</a>
    </div>
  </footer>

  <script src="data-check.js"></script>
  <script src="site.js"></script>
  <script>
    (async function () {
      const heroEl = document.getElementById('hero');
      const pinEl = document.getElementById('game-pin');
      const newsEl = document.getElementById('news-list');

      // ---- 大版位：本週／下次活動 ----
      try {
        const { items: schedule, badCount } = await loadChecked('data/schedule.json', 'schedule');
        const act = nextActivity(schedule);

        if (!act) {
          heroEl.className = 'hero empty';
          heroEl.textContent = '目前沒有排定的活動，請留意公告。';
        } else {
          const kind = isGame(act) ? 'game' : 'practice';
          // 落在本週就叫「本週活動」，已經跨到下週就叫「下次活動」
          const label = isThisWeek(act.date) ? '本週活動' : '下次活動';
          const cd = countdownText(act.date);
          const rows = timeRows(act);

          heroEl.className = `hero ${kind}`;
          heroEl.innerHTML = `
            <div class="label">${label}</div>
            <h1 class="headline">${escapeHtml(activityName(act))}</h1>
            <div class="when">${fmtDateLong(act.date)}${cd ? `<span class="countdown">${cd}</span>` : ''}</div>
            <dl>${rows.map(([k, v]) =>
              `<dt>${k}</dt><dd${k === '地點' && !hasVenue(act) ? ' class="tbd"' : ''}>${escapeHtml(v)}</dd>`
            ).join('')}</dl>
            ${act.note ? `<div class="note">${escapeHtml(act.note)}</div>` : ''}
          `;
        }

        // ---- 下一場比賽小卡：大版位已經是那場就不重複 ----
        const game = nextGame(schedule);
        if (!game || (act && game.date === act.date)) {
          document.getElementById('cols').classList.add('no-pin');
        } else {
          const cd = countdownText(game.date);
          pinEl.innerHTML = `
            <a class="game-pin" href="schedule.html">
              <div class="pin-label">下一場比賽</div>
              <div class="pin-title">龍安 vs ${escapeHtml(game.opponent || '未定')}</div>
              <div class="pin-when">${fmtDate(game.date)} ${escapeHtml(game.startTime || '')} 開賽${cd ? `・${cd}` : ''}</div>
              <div class="pin-meta">${escapeHtml(venueText(game))}</div>
            </a>`;
        }
        heroEl.insertAdjacentHTML('afterend', partialNoteHTML(badCount));
      } catch (err) {
        heroEl.className = 'hero empty';
        heroEl.textContent = '活動資料暫時讀不到，請稍後再試。';
        console.error(err);
      }

      // ---- 最新公告（最多 3 則）----
      try {
        const { items, badCount } = await loadChecked('data/announcements.json', 'announcements');
        const list = sortAnnouncements(items);
        newsEl.innerHTML = (list.length === 0
          ? '<div class="empty-note">目前沒有公告。</div>'
          : list.slice(0, 3).map(announcementHTML).join('')) + partialNoteHTML(badCount);
      } catch (err) {
        newsEl.innerHTML = '<div class="empty-note">公告暫時讀不到，請稍後再試。</div>';
        console.error(err);
      }
    })();
  </script>

</body>
</html>
