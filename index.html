<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍安棒球隊</title>
  <meta name="description" content="龍安棒球隊官方網站：最新公告、賽事時程與練球安排。">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="logo.png" alt="龍安棒球隊隊徽" onerror="this.style.display='none'">
        <span>龍安棒球隊</span>
      </a>
      <nav class="site-nav">
        <a href="index.html" class="active">首頁</a>
        <a href="news.html">公告</a>
        <a href="schedule.html">賽事時程</a>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <section id="next-game" class="next-game empty" aria-live="polite">
      載入中…
    </section>

    <div class="cols">

      <section>
        <div class="section-head">
          <h2>最新公告</h2>
          <a class="more-link" href="news.html">全部公告 →</a>
        </div>
        <div id="news-list">
          <div class="empty-note">載入中…</div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>快速前往</h2>
        </div>
        <a class="entry" href="schedule.html">
          <strong>賽事時程 &amp; 練球</strong>
          <span>接下來的比賽與練球安排</span>
        </a>
        <a class="entry" href="news.html">
          <strong>公告</strong>
          <span>球隊最新公佈事項</span>
        </a>
      </section>

    </div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>龍安棒球隊</span>
      <a href="tools/">隊職員專區</a>
    </div>
  </footer>

  <script src="site.js"></script>
  <script>
    (async function () {
      const gameEl = document.getElementById('next-game');
      const newsEl = document.getElementById('news-list');

      // ---- 下一場比賽 ----
      try {
        const schedule = await loadJSON('data/schedule.json');
        const next = pickNext(schedule, 'game');

        if (!next) {
          gameEl.className = 'next-game empty';
          gameEl.textContent = '目前沒有排定的比賽，請留意公告。';
        } else {
          const cd = countdownText(next.date);
          const rows = [];
          if (next.gatherTime) rows.push(['集合', next.gatherTime]);
          if (next.startTime) rows.push(['開賽', next.startTime]);
          if (next.venue) rows.push(['球場', next.venue]);

          gameEl.className = 'next-game';
          gameEl.innerHTML = `
            <div class="label">下一場比賽</div>
            <h1 class="matchup">龍安 vs ${escapeHtml(next.opponent || '未定')}</h1>
            <div class="when">${fmtDateLong(next.date)}${cd ? `<span class="countdown">${cd}</span>` : ''}</div>
            <dl>
              ${rows.map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`).join('')}
            </dl>
            ${next.note ? `<div class="note">${escapeHtml(next.note)}</div>` : ''}
          `;
        }
      } catch (err) {
        gameEl.className = 'next-game empty';
        gameEl.textContent = '賽事資料暫時讀不到，請稍後再試。';
        console.error(err);
      }

      // ---- 最新公告（最多 3 則）----
      try {
        const list = sortAnnouncements(await loadJSON('data/announcements.json'));
        if (list.length === 0) {
          newsEl.innerHTML = '<div class="empty-note">目前沒有公告。</div>';
        } else {
          newsEl.innerHTML = list.slice(0, 3).map(announcementHTML).join('');
        }
      } catch (err) {
        newsEl.innerHTML = '<div class="empty-note">公告暫時讀不到，請稍後再試。</div>';
        console.error(err);
      }
    })();
  </script>

</body>
</html>
