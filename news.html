<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告 - 龍安棒球隊</title>
  <meta name="description" content="龍安棒球隊的最新公告。">
  <link rel="icon" href="logo-192.png">
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="logo-192.png" alt="龍安棒球隊隊徽" onerror="this.style.display='none'">
        <span>龍安棒球隊</span>
      </a>
      <nav class="site-nav">
        <a href="index.html">首頁</a>
        <a href="news.html" class="active">公告</a>
        <a href="schedule.html">賽事時程</a>
      </nav>
    </div>
  </header>

  <main class="wrap page-body">

    <div class="section-head" style="margin-top:20px">
      <h2>公告</h2>
      <a class="more-link" href="schedule.html">賽事時程 →</a>
    </div>
    <div id="news-list"><div class="empty-note">載入中…</div></div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>龍安棒球隊</span>
      <a href="tools/">球隊管理</a>
    </div>
  </footer>

  <script src="data-check.js"></script>
  <script src="site.js"></script>
  <script>
    (async function () {
      const el = document.getElementById('news-list');
      try {
        const { items, badCount } = await loadChecked('data/announcements.json', 'announcements');
        const list = sortAnnouncements(items);
        const note = partialNoteHTML(badCount);

        if (!list.length) {
          el.innerHTML = '<div class="empty-note">目前沒有公告。</div>' + note;
          return;
        }

        // 只有一個年度時不分年，維持乾淨；跨年度才加標題並把舊的收起來
        const yearOf = (it) => String(it.date).slice(0, 4);
        const years = [...new Set(list.map(yearOf))].sort().reverse();

        if (years.length === 1) {
          el.innerHTML = note + list.map(announcementHTML).join('');
          return;
        }

        const thisYear = String(new Date().getFullYear());
        const current = list.filter((it) => yearOf(it) === thisYear);
        const older = list.filter((it) => yearOf(it) !== thisYear);

        let html = note;
        if (current.length) {
          html += `<h3 class="month-head">${thisYear}年</h3>` + current.map(announcementHTML).join('');
        }
        if (older.length) {
          const byYear = years.filter((y) => y !== thisYear).map((y) => {
            const rows = older.filter((it) => yearOf(it) === y);
            return `<h3 class="month-head">${y}年</h3>` + rows.map(announcementHTML).join('');
          }).join('');
          html += `
            <details class="past-box">
              <summary>更早的公告（${older.length}）</summary>
              <div>${byYear}</div>
            </details>`;
        }
        el.innerHTML = html;
      } catch (err) {
        el.innerHTML = '<div class="empty-note">公告暫時讀不到，請稍後再試。</div>';
        console.error(err);
      }
    })();
  </script>

</body>
</html>
